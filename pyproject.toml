[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3gif"
version = "0.3.1b0"
description = "Split ComfyUI storyboard contact sheets into frames and export looping GIFs."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
Repository = "https://github.com/Hejunlong27/H3GIF"
"Bug Tracker" = "https://github.com/Hejunlong27/H3GIF/issues"
Documentation = "https://github.com/Hejunlong27/H3GIF#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.comfy]
DisplayName = "H3GIF"
Icon = ""
requires-comfyui = ">=0.44.0"
# PublisherId is intentionally omitted until the project owner supplies it.
